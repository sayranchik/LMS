{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Вхід</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary mt-3" type="submit">Увійти</button>
    </form>
    <p class="mt-3">Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
  </div>
</div>
{% endblock %}
