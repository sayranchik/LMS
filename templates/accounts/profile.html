{% extends "base.html" %}
{% block title %}Профіль{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3">Профіль</h1>
    <p class="text-muted">Логін: {{ user.username }} · Роль: {{ user.get_role_display }}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="btn btn-primary mt-3" type="submit">Зберегти</button>
      <a class="btn btn-outline-secondary mt-3" href="{% url 'password_change' %}">Змінити пароль</a>
    </form>
  </div>
</div>
{% endblock %}
