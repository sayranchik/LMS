{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <h1 class="h3 mb-3">Реєстрація</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="btn btn-primary mt-3" type="submit">Створити акаунт</button>
    </form>
    <p class="mt-3">Вже є акаунт? <a href="{% url 'login' %}">Увійти</a></p>
  </div>
</div>
{% endblock %}
